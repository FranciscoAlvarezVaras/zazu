<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Zazu · logo B con más cuerpo</title>
<style>
  body{margin:0;background:#e9e4d8;font:15px/1.4 system-ui,sans-serif;color:#222;padding:28px}
  h1{font-size:20px;margin:0 0 18px}
  .fila{display:flex;gap:40px;align-items:flex-end;margin-bottom:26px}
  .op{text-align:center}
  .op p{margin:10px 0 0;font-weight:600}
  .op small{display:block;font-weight:400;color:#555}
  svg.tile{display:block;border-radius:22%;box-shadow:0 10px 30px rgba(0,0,0,.18)}
  .chicos{display:flex;gap:24px;align-items:center}
  .chicos svg{border-radius:22%}
  .barra{background:#0b4f6c;color:#f7f1e3;display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:14px;font-weight:600;font-size:22px}
</style>
</head>
<body>
<h1>Zazu · logo B (teja) con más cuerpo</h1>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="pelo" cx="0.5" cy="0.32" r="0.75"><stop offset="0" stop-color="#e49a4f"/><stop offset="0.55" stop-color="#cc7a31"/><stop offset="1" stop-color="#a1561f"/></radialGradient>
    <radialGradient id="pelo2" cx="0.5" cy="0.3" r="0.8"><stop offset="0" stop-color="#d98a42"/><stop offset="0.7" stop-color="#b9682a"/><stop offset="1" stop-color="#94501c"/></radialGradient>
    <linearGradient id="ojo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c3cf4a"/><stop offset="1" stop-color="#7c9a2a"/></linearGradient>
    <radialGradient id="pecho" cx="0.5" cy="0.4" r="0.6"><stop offset="0" stop-color="#f4dcc0"/><stop offset="1" stop-color="#e8bf96"/></radialGradient>

    <!-- solo la cabeza (sin cuello), centrada en 256,216 dentro de 512 -->
    <symbol id="cabeza" viewBox="0 0 512 512">
      <path d="M128,78 L158,228 C168,302 214,354 256,354 C298,354 344,302 354,228 L384,78 L300,172 C284,158 228,158 212,172 Z" fill="url(#pelo)" stroke="#7d4319" stroke-width="3" stroke-linejoin="round"/>
      <path d="M143,106 L161,210 L209,174 Z" fill="#f2c3ae"/><path d="M369,106 L351,210 L303,174 Z" fill="#f2c3ae"/>
      <path d="M128,78 L140,118 L156,104 Z" fill="#8c4a22" opacity="0.8"/><path d="M384,78 L372,118 L356,104 Z" fill="#8c4a22" opacity="0.8"/>
      <g stroke="#8c4a22" stroke-width="5" stroke-linecap="round" opacity="0.85"><path d="M233,202 L239,184"/><path d="M256,198 L256,178"/><path d="M279,202 L273,184"/></g>
      <ellipse cx="256" cy="284" rx="36" ry="26" fill="#f0d4b8"/>
      <g fill="none" stroke="#f1d9bf" stroke-width="10" stroke-linejoin="round"><path d="M186,236 C198,218 230,218 242,236 C230,250 198,250 186,236 Z"/><path d="M270,236 C282,218 314,218 326,236 C314,250 282,250 270,236 Z"/></g>
      <path d="M186,236 C198,218 230,218 242,236 C230,250 198,250 186,236 Z" fill="url(#ojo)"/><path d="M270,236 C282,218 314,218 326,236 C314,250 282,250 270,236 Z" fill="url(#ojo)"/>
      <ellipse cx="214" cy="236" rx="4.5" ry="11" fill="#1a1410"/><ellipse cx="298" cy="236" rx="4.5" ry="11" fill="#1a1410"/>
      <circle cx="209" cy="229" r="3" fill="#fff" opacity="0.9"/><circle cx="293" cy="229" r="3" fill="#fff" opacity="0.9"/>
      <g fill="none" stroke="#2a1a10" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><path d="M186,236 C198,218 230,218 242,236 C230,250 198,250 186,236 Z"/><path d="M270,236 C282,218 314,218 326,236 C314,250 282,250 270,236 Z"/><path d="M186,236 L172,229"/><path d="M326,236 L340,229"/></g>
      <path d="M245,270 L267,270 L256,283 Z" fill="#a8443a" stroke="#a8443a" stroke-width="3" stroke-linejoin="round"/>
      <g fill="none" stroke="#6a3a1e" stroke-width="3.5" stroke-linecap="round"><path d="M256,283 C256,293 247,297 240,293"/><path d="M256,283 C256,293 265,297 272,293"/></g>
      <g fill="none" stroke="#f7ecd8" stroke-width="2.5" stroke-linecap="round" opacity="0.75"><path d="M224,288 L172,280"/><path d="M224,294 L170,298"/><path d="M226,300 L178,316"/><path d="M288,288 L340,280"/><path d="M288,294 L342,298"/><path d="M286,300 L334,316"/></g>
    </symbol>

    <!-- B1 · busto: cabeza grande, hombros, pecho claro y las dos patas delante -->
    <symbol id="gato-busto" viewBox="0 0 512 512">
      <path d="M132,512 C128,420 160,352 256,352 C352,352 384,420 380,512 Z" fill="url(#pelo2)"/>
      <ellipse cx="256" cy="452" rx="66" ry="60" fill="url(#pecho)" opacity="0.95"/>
      <rect x="178" y="416" width="52" height="110" rx="26" fill="url(#pelo)" stroke="#7d4319" stroke-width="2.5"/>
      <rect x="282" y="416" width="52" height="110" rx="26" fill="url(#pelo)" stroke="#7d4319" stroke-width="2.5"/>
      <g stroke="#8c4a22" stroke-width="3" stroke-linecap="round" opacity="0.7"><path d="M196,500 L196,512"/><path d="M212,500 L212,512"/><path d="M300,500 L300,512"/><path d="M316,500 L316,512"/></g>
      <path d="M212,320 C220,360 230,372 256,372 C282,372 292,360 300,320 Z" fill="url(#pelo)"/>
      <use href="#cabeza" transform="translate(37,-10) scale(0.855)"/>
    </symbol>

    <!-- B2 · sentado: cuerpo entero, patas largas y cola con la punta oscura -->
    <symbol id="gato-sentado" viewBox="0 0 512 512">
      <path d="M342,452 C404,452 432,392 398,344 C386,328 372,330 376,352 C396,392 376,420 338,422 Z" fill="#b9682a" stroke="#7d4319" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M398,344 C386,328 372,330 376,352 C380,362 384,366 390,370 C400,362 404,352 398,344 Z" fill="#6e3a16"/>
      <path d="M150,470 C136,386 172,320 256,320 C340,320 376,386 362,470 Z" fill="url(#pelo2)"/>
      <ellipse cx="256" cy="402" rx="58" ry="58" fill="url(#pecho)" opacity="0.95"/>
      <rect x="196" y="368" width="42" height="104" rx="21" fill="url(#pelo)" stroke="#7d4319" stroke-width="2.5"/>
      <rect x="274" y="368" width="42" height="104" rx="21" fill="url(#pelo)" stroke="#7d4319" stroke-width="2.5"/>
      <ellipse cx="217" cy="470" rx="26" ry="11" fill="#d58a45" stroke="#7d4319" stroke-width="2.5"/>
      <ellipse cx="295" cy="470" rx="26" ry="11" fill="#d58a45" stroke="#7d4319" stroke-width="2.5"/>
      <g stroke="#8c4a22" stroke-width="2.5" stroke-linecap="round" opacity="0.7"><path d="M208,466 L208,476"/><path d="M226,466 L226,476"/><path d="M286,466 L286,476"/><path d="M304,466 L304,476"/></g>
      <path d="M222,300 C228,332 238,342 256,342 C274,342 284,332 290,300 Z" fill="url(#pelo)"/>
      <use href="#cabeza" transform="translate(76,18) scale(0.705)"/>
    </symbol>
  </defs>
</svg>

<div class="fila">
  <div class="op">
    <svg class="tile" width="272" height="272" viewBox="0 0 512 512" role="img" aria-label="B1 busto"><rect width="512" height="512" rx="112" fill="#0b4f6c"/><use href="#gato-busto"/></svg>
    <p>B1 · Busto<small>cabeza grande, hombros y patas: se lee bien en pequeño</small></p>
  </div>
  <div class="op">
    <svg class="tile" width="272" height="272" viewBox="0 0 512 512" role="img" aria-label="B2 sentado"><rect width="512" height="512" rx="112" fill="#0b4f6c"/><use href="#gato-sentado"/></svg>
    <p>B2 · Sentado<small>el gato entero, con su cola de punta oscura</small></p>
  </div>
</div>

<p>En pequeño (icono del móvil, pestaña, notificación) y en la cabecera:</p>
<div class="chicos">
  <svg width="64" height="64" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#0b4f6c"/><use href="#gato-busto"/></svg>
  <svg width="64" height="64" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#0b4f6c"/><use href="#gato-sentado"/></svg>
  <svg width="36" height="36" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#0b4f6c"/><use href="#gato-busto"/></svg>
  <svg width="36" height="36" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#0b4f6c"/><use href="#gato-sentado"/></svg>
  <div class="barra"><svg width="40" height="40" viewBox="0 0 512 512" style="border-radius:26%"><rect width="512" height="512" rx="112" fill="#f7f1e3"/><use href="#gato-busto"/></svg> Zazu</div>
  <div class="barra"><svg width="40" height="40" viewBox="0 0 512 512" style="border-radius:26%"><rect width="512" height="512" rx="112" fill="#f7f1e3"/><use href="#gato-sentado"/></svg> Zazu</div>
</div>
</body>
</html>
