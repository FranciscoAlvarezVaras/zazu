<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hermes Hub</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1815" media="(prefers-color-scheme: dark)">
<style>
:root{--bg:#faf9f5;--panel:#f0eee6;--card:#fff;--text:#1f1e1d;--muted:#73726c;--line:#e3e0d5;--accent:#c96442;--accent-t:#fff;--user:#e9e6dc;--code:#f0eee6;--ok:#3b8b5a;--bad:#b3402f}
@media (prefers-color-scheme:dark){:root{--bg:#1a1815;--panel:#211f1c;--card:#262421;--text:#ece9df;--muted:#9a978c;--line:#34312c;--accent:#e08a3c;--accent-t:#1a1815;--user:#2e2b26;--code:#161412;--ok:#5fb37e;--bad:#e07a68}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
#app{display:grid;grid-template-columns:300px 1fr;height:100dvh}
#side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#side header{padding:14px 14px 8px;display:flex;align-items:center;gap:8px}
#side h1{font-size:17px;margin:0;flex:1}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px}
.btn.primary{background:var(--accent);color:var(--accent-t);border-color:transparent;font-weight:600}
#list{overflow:auto;flex:1;padding:4px 8px 12px}
.sess{display:block;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:9px 10px;margin:2px 0}
.sess:hover,.sess.on{background:var(--card)}
.sess .t{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sess .p{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-right:6px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-left:6px;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
#main{display:flex;flex-direction:column;min-width:0;min-height:0}
#bar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);padding-top:max(10px,env(safe-area-inset-top))}
#bar .title{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#menu{display:none}
.tabs{display:flex;gap:4px}
.tab{border:0;background:none;padding:6px 12px;border-radius:9px;color:var(--muted)}
.tab.on{background:var(--panel);color:var(--text);font-weight:600}
.view{display:none;flex:1;min-height:0;flex-direction:column}
.view.on{display:flex}
#msgs{flex:1;overflow:auto;padding:18px 0 8px;scroll-behavior:smooth}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}
.m{margin:14px 0;display:flex;flex-direction:column}
.m.user{align-items:flex-end}
.bubble{max-width:100%;overflow-wrap:anywhere}
.m.user .bubble{background:var(--user);padding:9px 14px;border-radius:16px 16px 4px 16px;max-width:85%;white-space:pre-wrap}
.m.assistant .bubble{padding:2px 0}
.who{font-size:12px;color:var(--muted);margin:0 4px 3px}
.bubble p{margin:.5em 0}.bubble p:first-child{margin-top:0}.bubble p:last-child{margin-bottom:0}
.bubble code{background:var(--code);padding:1px 5px;border-radius:5px;font:13.5px ui-monospace,Menlo,Consolas,monospace}
.bubble pre{background:var(--code);border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow:auto;margin:.6em 0}
.bubble pre code{background:none;padding:0}
.bubble ul,.bubble ol{margin:.4em 0;padding-left:1.4em}
.bubble a{color:var(--accent)}
details.tool{border:1px solid var(--line);border-radius:10px;margin:8px 0;background:var(--card);font-size:13.5px}
details.tool summary{padding:6px 12px;cursor:pointer;color:var(--muted);list-style:none}
details.tool summary::before{content:"⚙ "}
details.tool pre{margin:0;border:0;border-top:1px solid var(--line);border-radius:0 0 10px 10px;max-height:280px;font-size:12.5px;white-space:pre-wrap}
.typing{color:var(--muted);font-size:14px;padding:4px 0}
.typing span{animation:pulse 1s infinite}
#composer{padding:8px 14px calc(12px + env(safe-area-inset-bottom))}
#box{max-width:820px;margin:0 auto;display:flex;gap:8px;align-items:flex-end;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:8px 8px 8px 14px;box-shadow:0 1px 8px #0000000f}
#box:focus-within{border-color:var(--accent)}
#inp{flex:1;border:0;outline:0;background:none;color:var(--text);resize:none;font:inherit;max-height:180px;padding:6px 0}
#send{border:0;background:var(--accent);color:var(--accent-t);width:40px;height:40px;border-radius:12px;font-size:18px;font-weight:700}
#send:disabled{opacity:.4}
#mic{border:1px solid var(--line);background:none;width:40px;height:40px;border-radius:12px;font-size:18px}
#mic.on{background:var(--bad);color:#fff;animation:pulse 1s infinite}
#chips{grid-template-columns:1fr 1fr}#chips .qa b{font-size:13px}
#dot{font-size:14px;color:var(--muted);cursor:default}#dot.ok{color:var(--ok)}#dot.bad{color:var(--bad)}
.empty{margin:auto;text-align:center;color:var(--muted);padding:30px}
.empty h2{color:var(--text);margin:0 0 6px}
#files,#stat,#asist{overflow:auto;padding:16px 0 30px}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:12px;font-size:14px}
.crumbs button{border:0;background:none;color:var(--accent);padding:2px 4px}
#asist{overflow:auto;padding:16px 0 30px}
#asist h3{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:18px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.qa{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px}
.qa:hover{border-color:var(--accent)}
.qa .i{font-size:20px}.qa b{font-size:14px}.qa small{color:var(--muted);font-size:12px;line-height:1.3}
.job{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;margin:6px 0}
.job .n{flex:1;min-width:150px}.job .n b{display:block;font-size:14.5px}.job .n small{color:var(--muted);font-size:12.5px}
.job .btn{padding:5px 10px;font-size:13px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);background:var(--card);border-radius:12px;margin:6px 0;cursor:pointer}
.row .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{color:var(--muted);font-size:12.5px;white-space:nowrap}
.ico{font-size:20px}
#drop{border:2px dashed var(--line);border-radius:14px;text-align:center;padding:14px;color:var(--muted);margin-bottom:12px}
#drop.over{border-color:var(--accent);color:var(--accent)}
.prog{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0}.prog i{display:block;height:100%;background:var(--accent);width:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.kv b{color:var(--muted);font-weight:500}
.ok{color:var(--ok)}.bad{color:var(--bad)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:14px;opacity:0;transition:.2s;pointer-events:none}
#toast.on{opacity:1}
@media(max-width:480px){#ttl{display:none}.tab{font-size:13px;padding:6px 7px}}
@media(max-width:760px){
 #app{grid-template-columns:1fr}
 #side{position:fixed;inset:0 25% 0 0;z-index:5;transform:translateX(-100%);transition:.2s}
 #side.open{transform:none;box-shadow:4px 0 20px #0005}
 #scrim{position:fixed;inset:0;background:#0006;z-index:4;display:none}
 #scrim.on{display:block}
 #menu{display:inline-block}
 .tab{padding:6px 9px}
}

details.work>summary{cursor:pointer;list-style:none;padding:2px 0}
details.work>summary::before{content:"▸ "}details.work[open]>summary::before{content:"▾ "}
details.work .steps{margin:6px 0 4px 6px;padding-left:12px;border-left:1px solid var(--line)}

<script>
const $=s=>document.querySelector(s);
let cur=null,curProfile='default',lastId=0,es=null,pending=new Set(),sessions=[],profs=['default'];
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2600)}
async function api(p,o){const r=await fetch(p,o);if(!r.ok){let m=r.status;try{m=(await r.json()).error||m}catch{}throw new Error(m)}return r.json()}
/* markdown mínimo y seguro */
function md(src){
 const blocks=[];src=src.replace(/```(\w*)\n?([\s\S]*?)```/g,(_,l,c)=>{blocks.push(`<pre><code>${esc(c.replace(/\n$/,''))}</code></pre>`);return `\u0000${blocks.length-1}\u0000`});
 const inl=t=>esc(t).replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/(^|[\s(])\*([^*\n]+)\*/g,'$1<i>$2</i>').replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>').replace(/(^|\s)(https?:\/\/[^\s<]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
 const out=[];let list=null;
 for(const ln of src.split('\n')){
  let m;
  if(m=ln.match(/^\s*[-*]\s+(.*)/)){if(list!='ul'){if(list)out.push(`</${list}>`);out.push('<ul>');list='ul'}out.push(`<li>${inl(m[1])}</li>`);continue}
  if(m=ln.match(/^\s*\d+[.)]\s+(.*)/)){if(list!='ol'){if(list)out.push(`</${list}>`);out.push('<ol>');list='ol'}out.push(`<li>${inl(m[1])}</li>`);continue}
  if(list){out.push(`</${list}>`);list=null}
  if(m=ln.match(/^#{1,6}\s+(.*)/)){out.push(`<p><b>${inl(m[1])}</b></p>`);continue}
  if(!ln.trim()){out.push('');continue}
  out.push(`<p>${inl(ln)}</p>`)
 }
 if(list)out.push(`</${list}>`);
 return out.join('').replace(/<\/p><p>/g,'<br>').replace(/\u0000(\d+)\u0000/g,(_,i)=>blocks[i]);
}
/* sesiones */
async function loadSessions(){
 try{sessions=await api('/api/sessions')}catch(e){return}
 const l=$('#list'),al=$('#autolist');l.innerHTML='';al.innerHTML='';
 for(const s of sessions){

if(!SR)$('#mic').style.display='none';else{let rec=null;$('#mic').onclick=()=>{if(rec){rec.stop();return}rec=new SR();rec.lang='es-ES';rec.onresult=e=>{const i=$('#inp');i.value+=(i.value?' ':'')+e.results[0][0].transcript;grow()};rec.onend=()=>{rec=null;$('#mic').classList.remove('on')};rec.onerror=()=>toast('No pude oírte: revisa el permiso del micrófono');rec.start();$('#mic').classList.add('on')}}
async function ping(){const d=$('#dot');try{const s=await api('/api/status');const ok=s.gateway==='running';d.className=ok?'ok':'bad';d.title=ok?'Hermes despierto · WhatsApp '+(Object.values(s.platforms||{})[0]||'?'):'Hermes: gateway '+s.gateway}catch(e){d.className='bad';d.title='Sin conexión con el servidor'}}
ping();setInterval(ping,30000);
/* inicio */
(async()=>{
 try{await api('/api/me')}catch(e){document.body.innerHTML='<div class="empty" style="margin-top:20vh"><h2>Acceso denegado</h2>Abre esta página desde tu dispositivo con Tailscale activo.</div>';return}
 try{profs=await api('/api/profiles')}catch(e){}
 await loadSessions();live();
 const q=new URLSearchParams(location.search),share=['title','text','url'].map(k=>q.get(k)).filter(Boolean).join('\n');
 if(q.has('nuevo')||share){newChat();const pf=q.get('perfil');if(pf&&profs.includes(pf)){$('#profSel').value=pf;$('#profSel').onchange()}if(share){$('#inp').value=share;grow()}$('#inp').focus();history.replaceState(null,'','/')}
 else if(q.get('tab')){tab(q.get('tab'));history.replaceState(null,'','/')}
 else{tab('hoy')}
 setInterval(loadSessions,20000);
})();
</script>
